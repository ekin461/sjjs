<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamConnect Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: #1e293b; padding: 2rem; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 400px; border: 1px solid #334155; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--primary); }
        .status { margin: 1.5rem 0; padding: 1rem; background: #0f172a; border-radius: 12px; font-mono: monospace; font-size: 1.2rem; border: 1px dashed var(--primary); }
        button { background: var(--primary); color: #0f172a; border: none; padding: 1rem 2rem; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { transform: scale(1.02); opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>StreamConnect</h1>
        <p>Bağlantı Kurmak İçin Kimliğiniz:</p>
        <div id="my-id" class="status">ID Alınıyor...</div>
        <button id="start-btn">EKRANI PAYLAŞ</button>
    </div>

    <script>
        const peer = new Peer();
        let localStream;

        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            try {
                // Bu kısım hem PC'de hem Android'de ekran yakalama penceresini açar
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                peer.on('call', call => {
                    call.answer(localStream);
                });
                alert("Yayın Hazır! ID'yi iletebilirsiniz.");
            } catch (err) {
                alert("Hata: " + err.message);
            }
        });
    </script>
</body>
</html>
