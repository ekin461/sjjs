<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamConnect Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .card { background: #1e293b; padding: 2rem; border-radius: 24px; width: 90%; max-width: 400px; border: 1px solid #334155; }
        .status { margin: 1.5rem 0; padding: 1rem; background: #0f172a; border-radius: 12px; border: 1px dashed var(--primary); font-size: 1.2rem; }
        button { background: var(--primary); color: #0f172a; border: none; padding: 1rem 2rem; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="card">
        <h1>StreamConnect</h1>
        <p>Bağlantı Kimliğiniz:</p>
        <div id="my-id" class="status">ID Alınıyor...</div>
        <button id="start-btn">YAYINI BAŞLAT</button>
        <p id="info-text" style="font-size: 0.8rem; margin-top: 10px; color: #94a3b8;"></p>
    </div>

    <script>
        const peer = new Peer();
        let localStream;
        const infoText = document.getElementById('info-text');

        // Cihaz mobil mi kontrol et
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        infoText.innerText = isMobile ? "Mobil mod: Kamera paylaşılacak." : "PC mod: Ekran paylaşılacak.";

        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
        });

        document.getElementById('start-btn').addEventListener('click', async () => {
            try {
                if (isMobile) {
                    // MOBİL İÇİN: Kamera izni iste
                    localStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "user" }, 
                        audio: true 
                    });
                } else {
                    // PC İÇİN: Ekran paylaşımı iste
                    localStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                }

                peer.on('call', call => {
                    call.answer(localStream);
                });
                
                alert("Yayın Başladı! ID'yi iletin.");
            } catch (err) {
                alert("Hata oluştu: " + err.message);
                console.error(err);
            }
        });
    </script>
</body>
</html>
